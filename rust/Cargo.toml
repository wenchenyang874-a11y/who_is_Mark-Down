[workspace]
members = [
    "crates/wimd-core",
    "crates/wimd-app",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
ammonia = "4.2.5"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clipboard-win = "5.4.1"
notify = "8.2.2"
open = "5.3.2"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
regex = "1.12.2"
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "multipart",
    "native-tls",
    "query",
] }
rfd = "0.15.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "2.12.5", features = ["common-controls-v6"] }
tauri-build = { version = "2.7.4", features = [] }
tempfile = "3.23.0"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["v4"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62.2", features = [
    "Win32_System_Com",
] }
webview2-com = "0.39.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
